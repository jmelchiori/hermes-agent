services:
  hermes-gateway-buyer:
    image: nousresearch/hermes-agent:main
    container_name: hermes-webui-stack-gateway-buyer
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
      hindsight:
        condition: service_healthy
      agenthub-api:
        condition: service_healthy
    env_file:
    - ./hermes-home/profiles/buyer/.env
    - ./config/agenthub-client.env
    environment:
      HERMES_HOME: /home/hermeswebui/.hermes
      HOME: /home/hermeswebui/.hermes/profiles/buyer/home
      XDG_STATE_HOME: /home/hermeswebui/.hermes/profiles/buyer/home/.local/state
      GH_CONFIG_DIR: /home/hermeswebui/.hermes/profiles/buyer/.config/gh
      PYTHONPATH: /workspace/hermes-agent-private
      PATH: /home/hermeswebui/.hermes/profiles/buyer/home/.local/bin:/opt/hermes/.venv/bin:/home/hermeswebui/.hermes/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      API_SERVER_ENABLED: 'true'
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: '8643'
      HINDSIGHT_API_URL: http://127.0.0.1:8888
      TZ: ${TZ:-America/Chicago}
      HERMES_GATEWAY_NO_SUPERVISE: '1'
      AGENT_BROWSER_EXECUTABLE_PATH: /opt/hermes/.playwright/chromium_headless_shell-1228/chrome-headless-shell-linux64/chrome-headless-shell
    secrets:
    - agenthub_api_token
    working_dir: /workspace
    command:
    - exec /opt/hermes/.venv/bin/hermes -p buyer gateway run
    volumes:
    - ./hermes-home:/home/hermeswebui/.hermes
    - ./hermes-home:/opt/data
    - ./workspace:/workspace
    restart: unless-stopped
    user: ${WANTED_UID}:${WANTED_GID}
    entrypoint:
    - /bin/sh
    - -lc
